name: generate animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/main.yml
      - .github/scripts/recent_activity.py

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout profile
        uses: actions/checkout@v4
      - name: Generate recent activity chart
        run: python3 .github/scripts/recent_activity.py
      - name: Generate contribution animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-blue.svg?color_snake=%238e3a1f&color_dots=%23efe6d4,%23e3cfa7,%23cfa46b,%23b07a3a,%238e3a1f
            dist/github-contribution-grid-snake-blue-dark.svg?color_snake=%23e0703a&color_dots=%23161b22,%232a2118,%235a3f22,%238e6230,%23d9a55b
      - name: Publish animations
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
